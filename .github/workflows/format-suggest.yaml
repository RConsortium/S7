on:
  pull_request:

name: format-suggest.yaml

permissions:
  contents: read

jobs:
  format-suggest:
    name: format-suggest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install
        uses: posit-dev/setup-air@v1

      - name: Format
        run: air format --check .
